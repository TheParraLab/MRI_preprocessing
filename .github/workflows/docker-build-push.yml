name: Docker Build & Push

on:
  release:
    types: [published]
  push:
    branches: [main]
    paths:
      - "control_system/dockerfile"
      - "control_system/**"
      - "code/**"
      - "requirements*.txt"

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    # Pull registry credentials into env vars so step `if:` (which cannot
    # reference `secrets.` directly) can still gate the push.
    env:
      FOU_RDOU_URL:      ${{ secrets.REGISTRY_URL }}
      FOU_RDOU_USER:     ${{ secrets.REGISTRY_USERNAME }}
      FOU_RDOU_PASS:     ${{ secrets.REGISTRY_PASSWORD }}
      DHUB_USER:   ${{ secrets.DOCKERHUB_USERNAME }}
      DHUB_TOKEN:  ${{ secrets.DOCKERHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - name: Set tags
        id: meta
        run: |
          if [[ "${{ github.ref_name }}" == "main" ]]; then
            echo "MRI_TAG=latest" >> "$GITHUB_OUTPUT"
          else
            echo "MRI_TAG=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Docker image
        run: |
          docker build \
            --tag "mri_preprocessing:${{ steps.meta.outputs.MRI_TAG }}" \
            --file control_system/dockerfile . \
            --build-arg VCS_REVISION=$(git rev-parse --short HEAD)

      - name: Push to Forgejo registry
        if: ${{ secrets.REGISTRY_URL != '' && secrets.REGISTRY_USERNAME != '' && secrets.REGISTRY_PASSWORD != '' }}
        run: |
          echo "${{ secrets.REGISTRY_PASSWORD }}" | docker login -u "${{ secrets.REGISTRY_USERNAME }}" --password-stdin "${{ secrets.REGISTRY_URL }}"
          docker tag "mri_preprocessing:${{ steps.meta.outputs.MRI_TAG }}" "${{ secrets.REGISTRY_URL }}/parra-lab/mri_preprocessing:${{ steps.meta.outputs.MRI_TAG }}"
          docker push "${{ secrets.REGISTRY_URL }}/parra-lab/mri_preprocessing:${{ steps.meta.outputs.MRI_TAG }}"
          IMAGE="${{ secrets.REGISTRY_URL }}/parra-lab/mri_preprocessing"
          echo ""
          echo "✅ On the HPC, pull with:"
          echo "   apptainer pull $IMAGE.sif docker://${IMAGE}:${{ steps.meta.outputs.MRI_TAG }}"

      - name: Push to DockerHub
        if: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
        run: |
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
          docker tag "mri_preprocessing:${{ steps.meta.outputs.MRI_TAG }}" "nickl99/preprocessing:${{ steps.meta.outputs.MRI_TAG }}"
          docker tag "mri_preprocessing:${{ steps.meta.outputs.MRI_TAG }}" "nickl99/preprocessing:latest"
          docker push "nickl99/preprocessing:${{ steps.meta.outputs.MRI_TAG }}"
          docker push "nickl99/preprocessing:latest"
          echo ""
          echo "✅ Also on DockerHub:"
          echo "   apptainer pull nickl99/preprocessing.sif docker://nickl99/preprocessing:${{ steps.meta.outputs.MRI_TAG }}"

      - name: Warn if no registry pushed
        if: ${{ !(secrets.REGISTRY_URL != '' && secrets.REGISTRY_USERNAME != '' && secrets.REGISTRY_PASSWORD != '') && !(secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '') }}
        run: |
          echo "WARNING: Neither Forgejo nor DockerHub secrets are configured — the image was built but not pushed anywhere."
          exit 1
