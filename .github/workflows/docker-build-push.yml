name: Docker Build & Push

on:
  release:
    types: [published]
  push:
    branches: [main]
    paths:
      - "control_system/dockerfile"
      - "control_system/**"
      - "code/**"
      - "requirements*.txt"
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    # Pull registry credentials into env vars so step `if:` (which cannot
    # reference `secrets.` directly) can still gate the push.
    env:
      FOU_RDOU_URL:      ${{ secrets.REGISTRY_URL }}
      FOU_RDOU_USER:     ${{ secrets.REGISTRY_USERNAME }}
      FOU_RDOU_PASS:     ${{ secrets.REGISTRY_PASSWORD }}
      DHUB_USER:   ${{ secrets.DOCKERHUB_USERNAME }}
      DHUB_TOKEN:  ${{ secrets.DOCKERHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - name: Set tags
        id: meta
        run: |
          if [[ "${{ github.ref_name }}" == "main" ]]; then
            echo "MRI_TAG=latest" >> "$GITHUB_OUTPUT"
          else
            echo "MRI_TAG=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Docker image
        run: |
          docker build \
            --tag "mri_preprocessing:${{ steps.meta.outputs.MRI_TAG }}" \
            --file control_system/dockerfile . \
            --build-arg VCS_REVISION=$(git rev-parse --short HEAD)

      - name: Push to Forgejo registry
        if: ${{ env.FOU_RDOU_URL != '' && env.FOU_RDOU_USER != '' && env.FOU_RDOU_PASS != '' }}
        run: |
          echo "${FOU_RDOU_PASS}" | docker login -u "${FOU_RDOU_USER}" --password-stdin "${FOU_RDOU_URL}"
          docker tag "mri_preprocessing:${{ steps.meta.outputs.MRI_TAG }}" "${FOU_RDOU_URL}/parra-lab/mri_preprocessing:${{ steps.meta.outputs.MRI_TAG }}"
          docker push "${FOU_RDOU_URL}/parra-lab/mri_preprocessing:${{ steps.meta.outputs.MRI_TAG }}"
          IMAGE="${FOU_RDOU_URL}/parra-lab/mri_preprocessing"
          echo ""
          echo "✅ On the HPC, pull with:"
          echo "   apptainer pull $IMAGE.sif docker://${IMAGE}:${{ steps.meta.outputs.MRI_TAG }}"

      - name: Push to DockerHub
        if: ${{ env.DHUB_USER != '' && env.DHUB_TOKEN != '' }}
        run: |
          echo "${DHUB_TOKEN}" | docker login -u "${DHUB_USER}" --password-stdin
          docker tag "mri_preprocessing:${{ steps.meta.outputs.MRI_TAG }}" "nickl99/preprocessing:${{ steps.meta.outputs.MRI_TAG }}"
          docker tag "mri_preprocessing:${{ steps.meta.outputs.MRI_TAG }}" "nickl99/preprocessing:latest"
          docker push "nickl99/preprocessing:${{ steps.meta.outputs.MRI_TAG }}"
          docker push "nickl99/preprocessing:latest"
          echo ""
          echo "✅ Also on DockerHub:"
          echo "   apptainer pull nickl99/preprocessing.sif docker://nickl99/preprocessing:${{ steps.meta.outputs.MRI_TAG }}"

      - name: Fail if no registry was configured
        if: ${{ env.FOU_RDOU_URL == '' && env.DHUB_USER == '' }}
        run: |
          echo "ERROR: Neither Forgejo (REGISTRY_URL/USERNAME/PASSWORD) nor DockerHub (DOCKERHUB_USERNAME/TOKEN) secrets are defined."
          echo "       Build succeeded but nothing was pushed. Set at least one set of secrets to publish this image."
          exit 1
